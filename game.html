<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Odyssey: Photorealistic Open World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background: #050508;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .hud-card {
            background: rgba(10, 10, 18, 0.8);
            padding: 16px 26px;
            border-radius: 14px;
            border: 1px solid rgba(255, 120, 0, 0.5);
            box-shadow: 0 8px 32px 0 rgba(255, 80, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ff9900;
            text-transform: uppercase;
        }

        .stat-bar-container {
            width: 220px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            margin: 8px 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-bar {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        #hp-bar { background: linear-gradient(90deg, #ff1e00, #ff5500); }
        #xp-bar { background: linear-gradient(90deg, #ffaa00, #ffee00); width: 0%; }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255, 140, 0, 0.3);
            pointer-events: none;
        }

        #quest-box {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            min-width: 210px;
        }

        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffaa00, #ff3300);
            color: #fff;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-card">
            <h1>Phoenix <span id="level-txt" class="level-badge">Lvl 1</span></h1>
            
            <div style="font-size: 11px; color: #bbb; letter-spacing: 1px;">HEALTH</div>
            <div class="stat-bar-container">
                <div id="hp-bar" class="stat-bar"></div>
            </div>

            <div style="font-size: 11px; color: #bbb; letter-spacing: 1px; margin-top: 6px;">XP TO UPGRADE</div>
            <div class="stat-bar-container">
                <div id="xp-bar" class="stat-bar"></div>
            </div>

            <div style="margin-top: 10px; font-size: 13px;">
                Flame Power: <span id="atk-val" style="color:#ffaa00; font-weight: bold;">20</span>
            </div>
        </div>
    </div>

    <div id="quest-box" class="hud-card">
        <h3 style="margin: 0 0 8px 0; color: #ffaa00; font-size: 15px; letter-spacing: 1px;">ACTIVE HUNT</h3>
        <div id="quest-desc" style="font-size: 14px;">Defeat Wild Creatures</div>
        <div id="quest-progress" style="font-size: 20px; font-weight: bold; margin-top: 6px; color: #00ffcc;">0 / 3</div>
    </div>

    <div id="controls-hint">
        <b>W / S</b>: Pitch | <b>A / D</b>: Turn | <b>SPACE</b>: Boost | <b>CLICK</b>: Flame Strike
    </div>

    <script>
        // --- ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c101a);
        scene.fog = new THREE.FogExp2(0x0c101a, 0.0025);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1200);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0x2d3a4e, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xff9944, 2.2);
        sunLight.position.set(150, 250, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- STATE ---
        const playerState = {
            level: 1, hp: 100, maxHp: 100, xp: 0, xpToNext: 100,
            attackPower: 20, speed: 0, maxSpeed: 1.1, targetSpeed: 0.4
        };
        const quest = { target: 3, current: 0 };

        // --- WORLD ---
        const worldSize = 700;
        const terrainGeo = new THREE.PlaneGeometry(worldSize, worldSize, 120, 120);
        terrainGeo.rotateX(-Math.PI / 2);

        const posAttr = terrainGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const z = posAttr.getZ(i);
            const y = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 22 + Math.sin(x * 0.04) * 7;
            posAttr.setY(i, y);
        }
        terrainGeo.computeVertexNormals();

        const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color: 0x1d3018, roughness: 0.85, flatShading: true }));
        terrain.receiveShadow = true;
        scene.add(terrain);

        // --- HIGH-REALISM PHOENIX MODEL ENGINE ---
        function createFeatherMesh(length, width, c1, c2) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.quadraticCurveTo(width * 1.2, length * 0.4, width, length);
            shape.quadraticCurveTo(0, length * 1.05, -width, length);
            shape.quadraticCurveTo(-width * 1.2, length * 0.4, 0, 0);

            const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.02, bevelEnabled: true, bevelSize: 0.01 });
            const mat = new THREE.MeshPhysicalMaterial({
                color: c1, emissive: c2, emissiveIntensity: 0.4,
                roughness: 0.2, metalness: 0.5, clearcoat: 0.8
            });
            return new THREE.Mesh(geo, mat);
        }

        function buildHyperRealisticPhoenix() {
            const phoenix = new THREE.Group();

            // Materials
            const bodyMat = new THREE.MeshPhysicalMaterial({
                color: 0xd62200, emissive: 0xaa1100, emissiveIntensity: 0.6,
                roughness: 0.15, metalness: 0.4, clearcoat: 1.0, clearcoatRoughness: 0.1
            });

            const beakMat = new THREE.MeshStandardMaterial({
                color: 0xffaa00, metalness: 0.8, roughness: 0.2, emissive: 0xff4400, emissiveIntensity: 0.2
            });

            const bodyGroup = new THREE.Group();

            // 1. SCULPTED ANATOMICAL TORSO & CHEST KEEL
            const chestGeo = new THREE.SphereGeometry(1.2, 16, 16);
            chestGeo.scale(0.85, 1.3, 1.9);
            const chest = new THREE.Mesh(chestGeo, bodyMat);
            chest.castShadow = true;
            bodyGroup.add(chest);

            // Layered Body Plumage (Feather Tiles on Body)
            for (let i = 0; i < 40; i++) {
                const featherTile = createFeatherMesh(0.6, 0.15, 0xff3300, 0xff8800);
                const phi = Math.random() * Math.PI * 2;
                const theta = Math.random() * Math.PI;

                featherTile.position.set(
                    0.7 * Math.sin(theta) * Math.cos(phi),
                    0.9 * Math.cos(theta),
                    1.2 * Math.sin(theta) * Math.sin(phi)
                );
                featherTile.rotation.set(theta, phi, 0);
                bodyGroup.add(featherTile);
            }

            // 2. DETAILED NECK & ANATOMICAL HEAD
            const neckGeo = new THREE.CylinderGeometry(0.35, 0.65, 2.2, 12);
            neckGeo.rotateX(0.35);
            const neck = new THREE.Mesh(neckGeo, bodyMat);
            neck.position.set(0, 1.2, 1.1);
            bodyGroup.add(neck);

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 2.2, 1.7);

            // Cranium Skull
            const craniumGeo = new THREE.SphereGeometry(0.55, 16, 16);
            craniumGeo.scale(0.8, 0.9, 1.1);
            const cranium = new THREE.Mesh(craniumGeo, bodyMat);
            headGroup.add(cranium);

            // Fierce Brow Ridge (Eagled Eyebrows)
            const browGeo = new THREE.BoxGeometry(0.8, 0.12, 0.4);
            const brow = new THREE.Mesh(browGeo, bodyMat);
            brow.position.set(0, 0.28, 0.25);
            brow.rotation.x = 0.2;
            headGroup.add(brow);

            // Realistic Multi-part Curved Beak
            const upperBeakShape = new THREE.Shape();
            upperBeakShape.moveTo(0, 0);
            upperBeakShape.lineTo(0.2, -0.15);
            upperBeakShape.quadraticCurveTo(0.18, -0.9, 0, -1.2);
            upperBeakShape.quadraticCurveTo(-0.18, -0.9, -0.2, -0.15);
            upperBeakShape.closePath();

            const upperBeakGeo = new THREE.ExtrudeGeometry(upperBeakShape, { depth: 0.18, bevelEnabled: true, bevelSize: 0.02 });
            upperBeakGeo.rotateX(-1.25);
            const upperBeak = new THREE.Mesh(upperBeakGeo, beakMat);
            upperBeak.position.set(0, 0.05, 0.45);
            headGroup.add(upperBeak);

            // Eyes & glowing pupil orbits
            const eyeSocketMat = new THREE.MeshBasicMaterial({ color: 0x110000 });
            const eyePupilMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            const createEye = (isLeft) => {
                const eyeGroup = new THREE.Group();
                const socket = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), eyeSocketMat);
                const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), eyePupilMat);
                pupil.position.z = 0.08;
                eyeGroup.add(socket, pupil);
                eyeGroup.position.set(isLeft ? 0.38 : -0.38, 0.12, 0.22);
                return eyeGroup;
            };
            headGroup.add(createEye(true), createEye(false));

            // Crown Crest Plumes
            for (let i = -3; i <= 3; i++) {
                const plume = createFeatherMesh(2.0, 0.12, 0xff5500, 0xffbb00);
                plume.position.set(i * 0.07, 0.35, -0.1);
                plume.rotation.x = -0.7 - Math.abs(i) * 0.08;
                plume.rotation.z = i * 0.12;
                headGroup.add(plume);
            }
            bodyGroup.add(headGroup);

            // 3. WINGS
            const createWing = (isLeft) => {
                const wing = new THREE.Group();
                const side = isLeft ? 1 : -1;

                for (let i = 0; i < 11; i++) {
                    const feather = createFeatherMesh(4.0 - i * 0.2, 0.22, 0xff2200, 0xffaa00);
                    feather.position.set((i * 0.35 + 0.5) * side, 0, -i * 0.12);
                    feather.rotation.z = side * (-1.2 + i * 0.08);
                    feather.rotation.y = side * 0.2;
                    wing.add(feather);
                }
                wing.position.set(0.6 * side, 0.3, 0.2);
                return wing;
            };

            const leftWing = createWing(true);
            const rightWing = createWing(false);
            bodyGroup.add(leftWing, rightWing);

            // 4. TAIL
            const tailGroup = new THREE.Group();
            tailGroup.position.set(0, -0.3, -1.2);
            for (let i = -3; i <= 3; i++) {
                const plume = createFeatherMesh(4.8 - Math.abs(i) * 0.4, 0.25, 0xff1100, 0xffaa00);
                plume.position.set(i * 0.18, 0, -0.2);
                plume.rotation.x = -2.6 + Math.abs(i) * 0.08;
                plume.rotation.y = i * 0.12;
                tailGroup.add(plume);
            }
            bodyGroup.add(tailGroup);

            // Light core
            const coreLight = new THREE.PointLight(0xff6600, 4.5, 20);
            coreLight.position.set(0, 0.5, 0.5);
            bodyGroup.add(coreLight);

            phoenix.add(bodyGroup);

            return { mesh: phoenix, leftWing, rightWing, tail: tailGroup, head: headGroup };
        }

        const phoenixData = buildHyperRealisticPhoenix();
        const player = phoenixData.mesh;
        player.position.set(0, 45, 0);
        scene.add(player);

        // --- WILDLIFE ---
        const animals = [];
        function spawnAnimal(isPredator = false) {
            const mesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.8, 1.8, 8, 16),
                new THREE.MeshStandardMaterial({ color: isPredator ? 0xff2244 : 0x2288ff })
            );
            mesh.castShadow = true;
            const x = (Math.random() - 0.5) * (worldSize - 80);
            const z = (Math.random() - 0.5) * (worldSize - 80);
            mesh.position.set(x, 10, z);

            const animalData = { mesh, isPredator, hp: isPredator ? 60 : 25, maxHp: isPredator ? 60 : 25, vx: 0.1, vz: 0.1 };
            scene.add(mesh);
            animals.push(animalData);
        }
        for (let i = 0; i < 15; i++) spawnAnimal(false);
        for (let i = 0; i < 5; i++) spawnAnimal(true);

        // --- CONTROLS & ATTACK ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') playerState.speed = Math.min(playerState.speed + 0.35, playerState.maxSpeed);
        });

        window.addEventListener('pointerdown', () => {
            const blast = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff6600, wireframe: true }));
            blast.position.copy(player.position);
            scene.add(blast);
            setTimeout(() => scene.remove(blast), 200);

            animals.forEach((a, index) => {
                if (player.position.distanceTo(a.mesh.position) < 12) {
                    a.hp -= playerState.attackPower;
                    if (a.hp <= 0) {
                        scene.remove(a.mesh);
                        animals.splice(index, 1);
                        quest.current++;
                        document.getElementById('quest-progress').innerText = `${quest.current} / ${quest.target}`;
                        spawnAnimal(Math.random() > 0.6);
                    }
                }
            });
        });

        // --- LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (keys['KeyA']) player.rotation.y += 1.6 * delta;
            if (keys['KeyD']) player.rotation.y -= 1.6 * delta;
            if (keys['KeyW']) player.rotation.x = Math.max(player.rotation.x - 1.3 * delta, -Math.PI / 2.8);
            if (keys['KeyS']) player.rotation.x = Math.min(player.rotation.x + 1.3 * delta, Math.PI / 2.8);

            if (!keys['KeyW'] && !keys['KeyS']) player.rotation.x *= 0.97;

            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
            playerState.speed = THREE.MathUtils.lerp(playerState.speed, playerState.targetSpeed, delta * 0.6);
            player.position.addScaledVector(forward, playerState.speed);

            // Flap animation
            const flapAngle = Math.sin(time * 10) * 0.65;
            phoenixData.leftWing.rotation.z = flapAngle;
            phoenixData.rightWing.rotation.z = -flapAngle;

            // Camera Tracking
            const camOffset = new THREE.Vector3(0, 4, -13).applyQuaternion(player.quaternion);
            camera.position.lerp(player.position.clone().add(camOffset), 0.1);
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
