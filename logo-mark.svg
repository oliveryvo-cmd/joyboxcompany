<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-label="Joy Box Company — send joy to a disabled kid">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#cfd8d6"/>
      <stop offset=".55" stop-color="#8fb5a8"/>
      <stop offset=".75" stop-color="#e8efec"/>
      <stop offset="1"   stop-color="#9aa8a4"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f6f9f8"/>
      <stop offset=".6"  stop-color="#c2cecb"/>
      <stop offset="1"   stop-color="#8e9c98"/>
    </linearGradient>
  </defs>

  <!-- mark: a gift box whose lid is a bow and whose face is a smile -->
  <g transform="translate(14,16)">
    <!-- bow -->
    <path d="M44 16 C34 2, 14 4, 20 18 C24 26, 38 24, 44 16 Z" fill="url(#steel2)"/>
    <path d="M44 16 C54 2, 74 4, 68 18 C64 26, 50 24, 44 16 Z" fill="url(#steel2)"/>
    <!-- box body, rounded -->
    <rect x="6" y="22" width="76" height="72" rx="22" fill="url(#steel)"/>
    <!-- face -->
    <circle cx="30" cy="50" r="5.5" fill="#12201c"/>
    <circle cx="58" cy="50" r="5.5" fill="#12201c"/>
    <path d="M28 66 Q44 82, 60 66" stroke="#12201c" stroke-width="7"
          stroke-linecap="round" fill="none"/>
    <!-- spark -->
    <path d="M92 20 L95 30 L105 33 L95 36 L92 46 L89 36 L79 33 L89 30 Z" fill="url(#steel2)"/>
  </g>

  <!-- wordmark -->
  <text x="128" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="1" fill="url(#steel)">JOYBOX</text>
  <text x="130" y="97" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="600" letter-spacing="4.2" fill="#8d8a84">SEND JOY TO A KID</text>
  <text x="130" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="600" letter-spacing="4.2" fill="#37c98d">WHO NEEDS IT</text>
</svg>
